name: money_manager
description: "money manager app."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
repository: https://github.com/ThanCoder/mony_manager.git
version: 0.2.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

  cupertino_icons: ^2.0.0
  cfb_store: ^0.8.0
  than_pkg_linux: ^0.3.0
  than_pkg_android: ^0.7.0
  package_info_plus: ^10.2.1
  dart_core_extensions: ^0.8.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  uuid: ^4.6.0
  intl: ^0.20.3

  dual_store:
    git: https://github.com/ThanCoder/dual_store.git
  t_client:
    git: https://github.com/ThanCoder/t_client
  # flutter pub upgrade --major-versions

  t_widgets: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  # dart run change_app_package_name:main than.app.money_manager
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons

  # dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo/logo.png"

flutter:
  uses-material-design: true

  assets:
  - assets/
  - assets/logo/
